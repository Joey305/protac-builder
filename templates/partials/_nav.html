<script>
  (function () {
    const nav = document.querySelector(".protac-nav");
    const menu = document.getElementById("mobileMenu");
    const toggle = document.getElementById("hamburgerBtn");
    const closeBtn = document.getElementById("protacNavClose");
    const backdrop = document.getElementById("protacNavBackdrop");

    if (!nav || !menu || !toggle || !backdrop) return;

    const mobileQuery = window.matchMedia("(max-width: 768px)");
    let previousBodyOverflow = "";
    let isOpen = false;

    function setOpen(open) {
      isOpen = open;

      menu.classList.toggle("is-open", open);
      menu.classList.toggle("show", open);
      toggle.classList.toggle("is-open", open);
      toggle.classList.toggle("active", open);
      backdrop.classList.toggle("is-open", open);
      backdrop.classList.toggle("show", open);

      toggle.setAttribute("aria-expanded", String(open));
      toggle.setAttribute("aria-label", open ? "Close navigation" : "Open navigation");

      backdrop.hidden = !open;

      if (open) {
        previousBodyOverflow = document.body.style.overflow;
        document.body.style.overflow = "hidden";

        window.setTimeout(function () {
          if (closeBtn) closeBtn.focus();
        }, 0);
      } else {
        document.body.style.overflow = previousBodyOverflow || "";
      }
    }

    function closeMenu() {
      setOpen(false);
    }

    function toggleMenu() {
      setOpen(!isOpen);
    }

    function handleScroll() {
      nav.classList.toggle("nav-scrolled", window.scrollY > 14);
    }

    toggle.addEventListener("click", function (event) {
      event.preventDefault();
      toggleMenu();
    });

    if (closeBtn) {
      closeBtn.addEventListener("click", function (event) {
        event.preventDefault();
        closeMenu();
      });
    }

    backdrop.addEventListener("click", closeMenu);

    menu.querySelectorAll("a").forEach(function (link) {
      link.addEventListener("click", function () {
        if (mobileQuery.matches) closeMenu();
      });
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && isOpen) closeMenu();
    });

    window.addEventListener("scroll", handleScroll, { passive: true });
    handleScroll();

    if (mobileQuery.addEventListener) {
      mobileQuery.addEventListener("change", function () {
        closeMenu();
      });
    } else if (mobileQuery.addListener) {
      mobileQuery.addListener(function () {
        closeMenu();
      });
    }
  })();
</script>
